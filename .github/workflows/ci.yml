# =============================================================
# 文件名：ci.yml
# 用途：GitHub Actions 自动构建 + 编译校验（自托管 Windows runner）
# 来源：S1 地基，针对制作人本机（Win10 / 8GB / GTX950M / Unity 2022.3.62f3c1）
# 关键决策（2026-07-30 修正）：
#   —— 弃用 game-ci/unity-builder。该 action 为 Linux/Docker 取向，
#      内部依赖 Unix `sh`，Windows 自托管 runner 无 `sh` 必崩；且需下载
#      较大第三方 action，弱网易超时。改为「直接 PowerShell 调本机 Unity」。
#      Unity 已装在你机器上，自托管 runner 直接调最稳、最省、8GB 也扛得住。
#   —— 零外部 action 依赖原则（2026-07-30 追加）：本 runner 拉 GitHub Marketplace
#      action 弱网易超时（game-ci/unity-builder、actions/upload-artifact@v4 均实测 100s
#      超时×3 失败）。CI 仅保留 actions/checkout@v4（runner 已缓存），其余一律直调
#      本机程序；构建日志直接打印到 Actions 控制台，并持久化到 D:\ci_last.log
#      （workspace 外、runner 不清理），排障时可直接读盘，免复制长日志。
# 设计要点：
#   1) runs-on: self-hosted —— 跑在制作人本机，零云端分钟费（ADR-004）。
#   2) 无头编译校验：-batchmode -quit -nographics（GPU 为 950M 无关，无头不渲染）。
#   3) 内存补偿：构建机物理内存仅 8GB，请把 Windows【页面文件(虚拟内存)】
#      设在 D 盘并放大到 16–24GB（设置→系统→关于→高级系统设置→性能→高级→虚拟内存），
#      否则 Unity 导入/Library 阶段极易 OOM 被 kill。这是 8GB 机器唯一真风险。
#   4) runner 必须以「你本人登录的账号」运行（开 D:\actions-runner\run.cmd 窗口，
#      别用服务），这样 Unity 能找到你已激活的许可证，无需额外激活步骤。
#   5) 轻量优先：基础阶段只做「编译/导入校验」（不产出 exe），省内存保 CI 常绿；
#      等有了正式场景 + 内存余量，再把第 2 步换成 -buildWindows64Player 出 exe，
#      并加 FPS 冒烟（目前 FPS 冒烟由你在本机 Unity 里手动看 Console 确认）。
# =============================================================

name: Build & Smoke Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # 自托管 Windows runner（制作人本机 D:\actions-runner 的 run.cmd）
    runs-on: self-hosted

    steps:
      # 1) 拉取代码（含 LFS 大资产）。actions/checkout 是很小的官方 action，无大包下载。
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2) 定位本机 Unity 编辑器（不依赖版本匹配，直接调已安装的 Unity）
      # ⚠️ 铁律（2026-07-31 实测）：run: 脚本体必须 100% 纯 ASCII！
      #    runner 把 step 脚本写成 UTF-8 无 BOM 的临时 .ps1，Windows PowerShell 5.1
      #    按 GBK 误读 → 中文/emoji 变乱码 → 破坏引号 → ParseError → 秒退 exit 1
      #    （此前「Locate Unity Editor」1 秒红、零日志的唯一真因）。
      #    中文说明只能放 YAML 注释层（# 开头、run 块之外），绝不进 run: |。
      - name: Locate Unity Editor
        id: unity
        shell: powershell
        run: |
          $paths = @("D:\Unity\2022.3.62f3c1\Editor\Unity.exe")
          # fallback: scan D:\Unity for any Unity.exe
          $glob = Get-ChildItem "D:\Unity" -Recurse -Filter Unity.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($glob) { $paths += $glob.FullName }
          $unity = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $unity) { throw "Unity.exe not found. Install 2022.3.62f3c1 or fix path in ci.yml." }
          echo "UNITY_PATH=$unity" >> $env:GITHUB_OUTPUT
          Write-Host "Unity path: $unity"

      # 3) 存档根密钥注入（E0-S5 子任务 4 / ADR-007）
      # ------------------------------------------------------------------
      # 由仓库 Secret `SAVE_ROOT_SECRET` 生成
      #   Assets/Scripts/Services/Generated/SaveSecret.cs
      # 该文件已在 .gitignore 中，【绝不入库】；它在 RuntimeInitializeOnLoadMethod
      # 时调用 SaveKeyProvider.InjectRootSecret() 注入正式根密钥。
      # 落库的不是 Secret 原文，而是 SHA-256(Secret) 的 32 字节摘要（Base64）——
      # 即便产物泄露也拿不到 Secret 原文；对 PBKDF2 而言 32B 随机根密钥强度足够。
      # 无 Secret 时（本地 / fork / 未配置）跳过生成，运行时自动落到
      # SaveKeyProvider.DevFallbackSecret（dev 回退密钥，档案头打 dev 位，P3 警告不拒读）。
      # 红线：日志绝不回显 Secret 或 payload；生成前先断言该文件未被误提交。
      # ⚠️ 同样遵守「run 块 100% 纯 ASCII」铁律（中文只在 # 注释层）。
      - name: Inject Save Root Secret (generated, never committed)
        shell: powershell
        env:
          SAVE_ROOT_SECRET: ${{ secrets.SAVE_ROOT_SECRET }}
        run: |
          $ErrorActionPreference = "Stop"
          $root = "${{ github.workspace }}"
          $rel  = "Assets/Scripts/Services/Generated/SaveSecret.cs"
          $dir  = Join-Path $root "Assets\Scripts\Services\Generated"
          $file = Join-Path $root "Assets\Scripts\Services\Generated\SaveSecret.cs"

          # Guard: the generated key file must never be tracked by git.
          $tracked = & git -C $root ls-files -- $rel
          if ($tracked) { throw "SECURITY: $rel is tracked by git. It must stay gitignored." }

          $raw = $env:SAVE_ROOT_SECRET
          if ([string]::IsNullOrWhiteSpace($raw)) {
            Write-Host "SAVE_ROOT_SECRET not configured: skipping generation."
            Write-Host "Runtime will fall back to SaveKeyProvider.DevFallbackSecret (dev flag set on saves)."
            if (Test-Path $file) { Remove-Item $file -Force }
            exit 0
          }

          if (-not (Test-Path $dir)) { New-Item -ItemType Directory -Path $dir -Force | Out-Null }

          $sha = [System.Security.Cryptography.SHA256]::Create()
          try {
            $digest = $sha.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($raw))
          } finally {
            $sha.Dispose()
          }
          $payload = [System.Convert]::ToBase64String($digest)

          $lines = New-Object System.Collections.Generic.List[string]
          $lines.Add('// =============================================================')
          $lines.Add('// AUTO-GENERATED BY CI (.github/workflows/ci.yml). DO NOT EDIT. DO NOT COMMIT.')
          $lines.Add('// Source: repository secret SAVE_ROOT_SECRET (E0-S5 / ADR-007).')
          $lines.Add('// Payload = Base64(SHA-256(secret)) -> 32-byte root secret for PBKDF2.')
          $lines.Add('// This path is gitignored: Assets/Scripts/Services/Generated/SaveSecret.cs')
          $lines.Add('// =============================================================')
          $lines.Add('')
          $lines.Add('using System;')
          $lines.Add('using UnityEngine;')
          $lines.Add('')
          $lines.Add('namespace MJ.Services')
          $lines.Add('{')
          $lines.Add('    internal static class SaveSecret')
          $lines.Add('    {')
          $lines.Add("        private const string Payload = `"$payload`";")
          $lines.Add('')
          $lines.Add('        [RuntimeInitializeOnLoadMethod(RuntimeInitializeLoadType.BeforeSceneLoad)]')
          $lines.Add('        private static void Inject()')
          $lines.Add('        {')
          $lines.Add('            SaveKeyProvider.InjectRootSecret(Convert.FromBase64String(Payload));')
          $lines.Add('        }')
          $lines.Add('    }')
          $lines.Add('}')

          [System.IO.File]::WriteAllText($file, ($lines -join "`r`n") + "`r`n", (New-Object System.Text.UTF8Encoding($false)))

          $payload = $null
          $raw = $null
          $len = (Get-Item $file).Length
          Write-Host "Generated SaveSecret.cs ($len bytes). Key material NOT printed."
          Write-Host "Note: this file is gitignored and is regenerated on every CI run."

      # 3.5) A11 自检：CI 日志绝不回显 Save Secret 明文（S2 收口遗留项 b）
      # ------------------------------------------------------------------
      # 背景：上一步由仓库 Secret 生成 SaveSecret.cs，其中
      #   Payload = Base64(SHA-256(SAVE_ROOT_SECRET))，即 32 字节 PBKDF2 根密钥。
      # 红线：Payload 与 Secret 原文【都绝不允许】出现在任何 CI 日志里。
      # 本步为纯 PowerShell 文本自检（不启动 Unity、不需 GPU），分两层：
      #   Layer 1（预防 / 静态）：扫 ci.yml 自身，禁止任何「把密钥变量打印出来」的写法
      #     （Write-Host / echo 携带 payload、raw、env:SAVE_ROOT_SECRET 等密钥变量，
      #      或用 Get-Content 直接 cat 生成文件）。这层保证以后没人手滑加一行 debug
      #      打印就把密钥送进 Actions 控制台——step3 的 stdout 完全由脚本文本决定，
      #      故静态审计即可完备覆盖「step3 不回显」这一命题。
      #   Layer 2（实测 / 动态）：在本步内用与 step3 完全相同的算法重算 Payload，
      #      仅作为内存中的比对串（绝不打印），再用 Select-String -SimpleMatch
      #      在磁盘上的 CI 日志里做【字面量精确匹配】。
      # 为什么用字面量精确匹配、而不用 `Payload\s*=|SaveSecret|44 位 base64` 这类模糊正则：
      #   这些模糊特征在正常日志里大量存在——Unity 编译时必然打印
      #   "Assets/Scripts/Services/Generated/SaveSecret.cs" 这个文件名；Unity 的 GUID /
      #   资产 hash 本身就长得像 base64；step3 生成文件的注释里也有 "Payload = ..."。
      #   用模糊正则会把「一切正常」误判成红，门控很快就会被当成噪音关掉。
      #   真正的泄漏判据只有一个：Payload 字面量本身出现在日志里。故取零误报的最保守判据。
      # 安全细节：命中时【只报文件名 + 行号，绝不回显命中行内容】，
      #   否则自检步骤本身就成了新的泄漏点。
      # 原文比对下限 12 字符：防止 Secret 被设成极短串时对正常日志造成误报。
      # ⚠️ 同样遵守「run 块 100% 纯 ASCII」铁律（中文只在 # 注释层）。
      - name: Verify Save Secret Not Logged (A11)
        shell: powershell
        env:
          SAVE_ROOT_SECRET: ${{ secrets.SAVE_ROOT_SECRET }}
        run: |
          $ErrorActionPreference = "Stop"
          $root = "${{ github.workspace }}"
          $violations = New-Object System.Collections.Generic.List[string]

          # ---------- Layer 1: static audit of this workflow's run blocks ----------
          # Patterns are assembled by concatenation on purpose: a literal pattern would
          # match its own declaration line in this very file (self-match false positive).
          $d = [char]36
          $banned = @(
            ('Write-Host[^\r\n]*\'  + $d + 'payload'),
            ('Write-Host[^\r\n]*\'  + $d + 'raw\b'),
            ('Write-Host[^\r\n]*\'  + $d + 'env:SAVE_ROOT_SECRET'),
            ('Write-Output[^\r\n]*\' + $d + 'payload'),
            ('Write-Output[^\r\n]*\' + $d + 'env:SAVE_ROOT_SECRET'),
            ('echo[^\r\n]*\'        + $d + 'payload'),
            ('echo[^\r\n]*\'        + $d + 'env:SAVE_ROOT_SECRET'),
            ('Write-Host[^\r\n]*secrets\' + '.SAVE_ROOT_SECRET'),
            ('Get-Content[^\r\n]*Save' + 'Secret')
          )
          $wf = Join-Path $root ".github\workflows\ci.yml"
          if (-not (Test-Path $wf)) { throw "A11 SETUP ERROR: workflow file not found at $wf" }
          # -Encoding UTF8 is mandatory: this file is BOM-less UTF-8 with CJK comments, and
          # Windows PowerShell 5.1 would otherwise decode it as the ANSI codepage, silently
          # merging lines and reporting wrong line numbers.
          $lineNo = 0
          $audited = 0
          foreach ($line in (Get-Content -Path $wf -Encoding UTF8)) {
            $lineNo++
            # Comment lines cannot print anything at runtime; skipping them also prevents the
            # prose that documents these very patterns from matching itself.
            if ($line.TrimStart().StartsWith("#")) { continue }
            $audited++
            foreach ($p in $banned) {
              if ($line -match $p) {
                $violations.Add("ci.yml line " + $lineNo + " : banned secret-echo construct [" + $p + "]")
              }
            }
          }
          Write-Host ("A11 layer1: read " + $lineNo + " workflow lines, audited " + $audited + " executable lines against " + $banned.Count + " banned echo patterns.")

          # ---------- Layer 2: exact-literal scan of on-disk CI logs ----------
          $targets = New-Object System.Collections.Generic.List[string]
          foreach ($p in @("D:\ci_last.log", "D:\ci_editmode.log")) {
            if (Test-Path $p) { $targets.Add($p) }
          }
          foreach ($dir in @($root, (Join-Path $root "Logs"), (Join-Path $root "TestResults"))) {
            if (Test-Path $dir) {
              Get-ChildItem -Path $dir -Filter *.log -File -ErrorAction SilentlyContinue |
                ForEach-Object { $targets.Add($_.FullName) }
            }
          }
          $files = $targets | Sort-Object -Unique
          $secret = $env:SAVE_ROOT_SECRET
          if ([string]::IsNullOrWhiteSpace($secret)) {
            Write-Host "A11 layer2: SAVE_ROOT_SECRET not configured -> no key material exists this run; literal scan skipped."
          } else {
            $sha = [System.Security.Cryptography.SHA256]::Create()
            try {
              $digest = $sha.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($secret))
            } finally {
              $sha.Dispose()
            }
            $needles = New-Object System.Collections.Generic.List[string]
            $needles.Add([System.Convert]::ToBase64String($digest))
            if ($secret.Length -ge 12) { $needles.Add($secret) }
            $scanned = 0
            foreach ($f in $files) {
              $scanned++
              foreach ($n in $needles) {
                $hits = Select-String -Path $f -Pattern $n -SimpleMatch -ErrorAction SilentlyContinue
                foreach ($h in $hits) {
                  $violations.Add("LEAK in " + $f + " at line " + $h.LineNumber + " (matched content REDACTED on purpose)")
                }
              }
            }
            $needles = $null
            $digest = $null
            Write-Host ("A11 layer2: literal-scanned " + $scanned + " CI log file(s) for key material.")
          }
          $secret = $null

          # ---------- Verdict ----------
          if ($violations.Count -gt 0) {
            Write-Host "==== A11 violations (contents redacted) ====" -ForegroundColor Red
            foreach ($v in $violations) { Write-Host $v -ForegroundColor Red }
            throw "A11 VIOLATION: Save secret plaintext leaked to CI log"
          }
          Write-Host "A11 OK: no Save secret plaintext in CI log" -ForegroundColor Green

      # 4) 编译与导入校验（轻量，8GB 安全）
      #    无头打开工程：导入资源 + 编译 C# 脚本 + 退出。退出码 0 = 工程可正常编译。
      - name: Compile & Import Validation (lightweight, 8GB-safe)
        shell: powershell
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        # 日志写到工作区之外（D:\ci_last.log），runner 不清理，可直接读盘排障。
        # 同样遵守「run 块纯 ASCII」铁律。
        # ⚠️ 铁律二（2026-07-31 实测坐实）：必须用 Start-Process -Wait 启动 Unity，
        #    绝不能用 PowerShell 的 `& $unity ...`！
        #    实测 Unity.exe 的 PE Subsystem = 2（WINDOWS_GUI），PowerShell 的 `&`
        #    只对「控制台子系统」程序阻塞等待，对 GUI 子系统程序【立即返回】。
        #    后果：脚本秒退 → $LASTEXITCODE 取到垃圾值 → throw → step exit 1；
        #    Unity 才刚启动就被 runner 当残留子进程 kill，日志文件都来不及写。
        #    这就是 CI「8 秒报红 + D:\ci_last.log 从不生成 + 子进程被 Kill」的唯一真因。
        run: |
          $unity = "${{ steps.unity.outputs.UNITY_PATH }}"
          $project = "${{ github.workspace }}"
          $log = "D:\ci_last.log"
          if (Test-Path $log) { Remove-Item $log -Force -ErrorAction SilentlyContinue }
          $argLine = "-batchmode -quit -nographics -projectPath `"$project`" -logFile `"$log`""
          Write-Host "Headless open project: validate script compile + asset import (no exe, low memory)..."
          Write-Host "Launching (Start-Process -Wait) : $unity $argLine"
          $proc = Start-Process -FilePath $unity -ArgumentList $argLine -PassThru -Wait -NoNewWindow
          $code = $proc.ExitCode
          Write-Host "Unity exit code: $code"
          if (Test-Path $log) {
            Write-Host "==== Unity log: error/failed/exception lines ===="
            Select-String -Path $log -Pattern "error|failed|fatal|exception|could not|unable to|undefined|Received" -CaseSensitive:$false | ForEach-Object { $_.Line } | Select-Object -First 50
            Write-Host "==== Unity log tail 120 ===="
            Get-Content $log -Tail 120
          } else {
            Write-Host "WARNING: Unity wrote no log file at $log (very early crash; check Unity path / license)."
          }
          if ($code -ne 0) { throw "Unity compile/import FAILED (exit code $code). See log above." }
          Write-Host "PASS: compile/import validation OK (project opens with no compile errors)."

      # 5) EditMode 测试门控（S2-R7 自检）：-batchmode -nographics -runTests
      #    跑 EditMode 程序集，产出 NUnit XML（-testResults）。退出码语义：
      #      0 = 全过 / 2 = 有失败 / 3 = 运行失败（编译/装配错误等）。
      #    非 0 即判 CI 红（S2-R7 要求门控生效）——故非 0 即 throw。
      #    ⚠️ run 块 100% 纯 ASCII 铁律（中文只在 # 注释层）。
      #    ⚠️ 铁律二：必须用 Start-Process -Wait 启动 Unity，绝不能用 `&`。
      #
      #    ⚠️⚠️ 铁律三（2026-07-31 实测坐实，本步「假绿」唯一真因）：
      #      -runTests 绝对不能和 -quit 同时使用！
      #      测试运行器（UnityEditor.TestTools.TestRunner）是【跨多个 editor update
      #      tick + 域重载】异步驱动的：工程加载完 → TestStarter 注册回调 → 之后若干帧
      #      才真正开始跑用例。而 -quit 的语义是「工程加载完、第一个 update tick 结束
      #      就退出」。两者相遇 → 编辑器在测试运行器启动之前就 shutdown，
      #      结果：0 个用例执行、不写 results XML、且走的是正常退出路径 → exit 0 → 【假绿】。
      #      D:\ci_editmode.log 实证：命令行含 -quit；`InitializeOnLoad TestStarter` 已初始化；
      #      紧接着 `Batchmode quit successfully invoked - shutting down!`；
      #      全日志零 Running/Passed/Failed/NUnit 输出；return code 0。
      #      对照组（同机同版本、唯一差异是【不带 -quit】）：TestResults/editmode-run.log
      #      正常执行 21 个用例并写出 editmode-results.xml。A/B 结论明确。
      #      官方文档 com.unity.test-framework@1.1.33/Documentation~/reference-command-line.md
      #      给出的规范调用也【只有】-runTests -batchmode -projectPath -testResults -testPlatform，
      #      不含 -quit（-quit 也不在其支持参数列表内）。-runTests 跑完会自行退出，无需 -quit。
      #
      #    ⚠️ 反「假绿」纵深防御：光靠退出码不够（0 个用例执行同样是 exit 0）。
      #      因此本步额外强制断言 results XML：文件必须存在、能解析、
      #      且实际执行用例数 >= $minTests。任一不满足即判红。
      #      这样「测试根本没跑」这一类故障【结构上不可能】再报绿。
      #      $minTests 取 40（当前仓库 EditMode 用例约 58 个 = 42 个 [Test] + 16 个 [TestCase]）；
      #      留出余量以免正常增删用例导致脆断，但足以拦截「0 个」「掉了整个程序集」。
      - name: EditMode Tests (self-check gate, S2-R7)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $unity = "${{ steps.unity.outputs.UNITY_PATH }}"
          $project = "${{ github.workspace }}"
          $testResults = "${{ github.workspace }}\EditMode-results.xml"
          $log = "D:\ci_editmode.log"
          $minTests = 40
          if (Test-Path $log) { Remove-Item $log -Force -ErrorAction SilentlyContinue }
          # Remove any stale results file so we can never assert on a previous run's XML.
          if (Test-Path $testResults) { Remove-Item $testResults -Force -ErrorAction SilentlyContinue }
          # NOTE: NO -quit here. See rule 3 in the comments above: -quit + -runTests => 0 tests, exit 0.
          $argLine = "-batchmode -nographics -projectPath `"$project`" -runTests -testPlatform EditMode -testResults `"$testResults`" -logFile `"$log`""
          Write-Host "Running EditMode tests (Start-Process -Wait, NO -quit)..."
          Write-Host "Launching: $unity $argLine"
          $proc = Start-Process -FilePath $unity -ArgumentList $argLine -PassThru -Wait -NoNewWindow
          $code = $proc.ExitCode
          Write-Host "Unity test runner exit code: $code (0=all pass, 2=failures, 3=run error)"
          if (Test-Path $log) {
            Write-Host "==== Unity test log: error/failure lines ===="
            Select-String -Path $log -Pattern "error|failed|exception|test runner|no tests|Failing" -CaseSensitive:$false | ForEach-Object { $_.Line } | Select-Object -First 50
            Write-Host "==== Unity test log tail 80 ===="
            Get-Content $log -Tail 80
          } else {
            Write-Host "WARNING: Unity wrote no log at $log (very early crash)."
          }
          # ---- Anti false-green assertions on the NUnit results XML ----
          if (-not (Test-Path $testResults)) {
            throw "GATE BROKEN: no results XML at $testResults -> ZERO tests executed. Failing on purpose (a gate that runs nothing must never report green)."
          }
          [xml]$doc = Get-Content -Raw -Path $testResults
          $run = $doc.'test-run'
          if ($null -eq $run) { throw "GATE BROKEN: results XML has no <test-run> root element. Failing on purpose." }
          $total = [int]$run.total
          $passed = [int]$run.passed
          $failed = [int]$run.failed
          $skipped = [int]$run.skipped
          Write-Host "==== EditMode results: total=$total passed=$passed failed=$failed skipped=$skipped ===="
          if ($total -lt $minTests) {
            throw "GATE BROKEN: only $total test(s) executed, expected at least $minTests. The EditMode test assembly was probably not compiled or not discovered. Failing on purpose."
          }
          if ($failed -gt 0) { throw "EditMode tests FAILED: $failed failing test(s) out of $total. Gate RED. See log above." }
          if ($code -ne 0) { throw "EditMode tests FAILED (exit code $code). Gate RED. See log above." }
          Write-Host "PASS: EditMode tests green ($passed/$total passed, gate self-check OK)."

      # 6) PlayMode 测试门控（E2-S2 深度排序）：-batchmode -nographics -runTests -testPlatform PlayMode
      #    覆盖 DepthSortTests.cs 的 4 个 PlayMode 用例（纯相机状态断言，不依赖渲染）。
      #    ⚠️ run 块 100% 纯 ASCII 铁律（中文只在 # 注释层）。
      #    ⚠️ 铁律二：必须用 Start-Process -Wait 启动 Unity，绝不能用 `&`。
      #    ⚠️ 铁律三：绝不加 -quit（-runTests + -quit => 0 测试 + 假绿，见 step5 注释）。
      #    ⚠️ 已知风险：无显卡(-nographics) runner 下 PlayMode 能否跑需真机验证；
      #       若 Unity 报"无法进入 Play 模式/无 GPU"类错误，此步骤需回调（改标记跳过或换带 GPU runner）。
      - name: PlayMode Tests (E2-S2 gate)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $unity = "${{ steps.unity.outputs.UNITY_PATH }}"
          $project = "${{ github.workspace }}"
          $testResults = "${{ github.workspace }}\PlayMode-results.xml"
          $log = "D:\ci_playmode.log"
          $minTests = 4
          if (Test-Path $log) { Remove-Item $log -Force -ErrorAction SilentlyContinue }
          if (Test-Path $testResults) { Remove-Item $testResults -Force -ErrorAction SilentlyContinue }
          $argLine = "-batchmode -nographics -projectPath `"$project`" -runTests -testPlatform PlayMode -testResults `"$testResults`" -logFile `"$log`""
          Write-Host "Running PlayMode tests (Start-Process -Wait, NO -quit)..."
          Write-Host "Launching: $unity $argLine"
          $proc = Start-Process -FilePath $unity -ArgumentList $argLine -PassThru -Wait -NoNewWindow
          $code = $proc.ExitCode
          Write-Host "Unity test runner exit code: $code (0=all pass, 2=failures, 3=run error)"
          if (Test-Path $log) {
            Write-Host "==== Unity PlayMode log: error/failure lines ===="
            Select-String -Path $log -Pattern "error|failed|exception|test runner|no tests|Failing|cannot|gpu|graphics" -CaseSensitive:$false | ForEach-Object { $_.Line } | Select-Object -First 50
            Write-Host "==== Unity PlayMode log tail 80 ===="
            Get-Content $log -Tail 80
          } else {
            Write-Host "WARNING: Unity wrote no log at $log (very early crash)."
          }
          if (-not (Test-Path $testResults)) { throw "PlayMode results XML missing - tests did not run (false green guard)." }
          [xml]$x = Get-Content $testResults
          $total = 0; $failed = 0
          if ($x."test-run".total) { $total = [int]$x."test-run".total }
          if ($x."test-run".failed) { $failed = [int]$x."test-run".failed }
          if ($total -lt $minTests) { throw "Too few PlayMode tests executed ($total < $minTests) - possible false green or PlayMode unsupported in headless." }
          if ($failed -gt 0) { throw "PlayMode tests FAILED: $failed failing test(s). See log above." }
          Write-Host "PASS: $total PlayMode tests executed, $failed failed."

      # 说明：基础阶段用「轻量编译校验」保证 CI 常绿且不爆 8GB 内存。
      # 注意：本 runner 弱网，拉 GitHub Marketplace action 易 100s 超时（upload-artifact
      # 已实测失败），故构建日志直接打印到控制台，绝不依赖 upload-artifact。
      # 后续升级到出 exe + FPS 冒烟时，将第 3 步替换为：
      #   & $unity -batchmode -quit -nographics -projectPath $project `
      #     -buildWindows64Player "$env:RUNNER_TEMP\build\MijingFanchen.exe" -logFile $log
      # 并在 Build Settings 中加入至少一个场景后启用。
