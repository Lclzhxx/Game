# =============================================================
# 文件名：ci.yml
# 用途：GitHub Actions 自动构建 + 编译校验（自托管 Windows runner）
# 来源：S1 地基，针对制作人本机（Win10 / 8GB / GTX950M / Unity 2022.3.62f3c1）
# 关键决策（2026-07-30 修正）：
#   —— 弃用 game-ci/unity-builder。该 action 为 Linux/Docker 取向，
#      内部依赖 Unix `sh`，Windows 自托管 runner 无 `sh` 必崩；且需下载
#      较大第三方 action，弱网易超时。改为「直接 PowerShell 调本机 Unity」。
#      Unity 已装在你机器上，自托管 runner 直接调最稳、最省、8GB 也扛得住。
#   —— 零外部 action 依赖原则（2026-07-30 追加）：本 runner 拉 GitHub Marketplace
#      action 弱网易超时（game-ci/unity-builder、actions/upload-artifact@v4 均实测 100s
#      超时×3 失败）。CI 仅保留 actions/checkout@v4（runner 已缓存），其余一律直调
#      本机程序；构建日志直接打印到 Actions 控制台，并持久化到 D:\ci_last.log
#      （workspace 外、runner 不清理），排障时可直接读盘，免复制长日志。
# 设计要点：
#   1) runs-on: self-hosted —— 跑在制作人本机，零云端分钟费（ADR-004）。
#   2) 无头编译校验：-batchmode -quit -nographics（GPU 为 950M 无关，无头不渲染）。
#   3) 内存补偿：构建机物理内存仅 8GB，请把 Windows【页面文件(虚拟内存)】
#      设在 D 盘并放大到 16–24GB（设置→系统→关于→高级系统设置→性能→高级→虚拟内存），
#      否则 Unity 导入/Library 阶段极易 OOM 被 kill。这是 8GB 机器唯一真风险。
#   4) runner 必须以「你本人登录的账号」运行（开 D:\actions-runner\run.cmd 窗口，
#      别用服务），这样 Unity 能找到你已激活的许可证，无需额外激活步骤。
#   5) 轻量优先：基础阶段只做「编译/导入校验」（不产出 exe），省内存保 CI 常绿；
#      等有了正式场景 + 内存余量，再把第 2 步换成 -buildWindows64Player 出 exe，
#      并加 FPS 冒烟（目前 FPS 冒烟由你在本机 Unity 里手动看 Console 确认）。
# =============================================================

name: Build & Smoke Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # 自托管 Windows runner（制作人本机 D:\actions-runner 的 run.cmd）
    runs-on: self-hosted

    steps:
      # 1) 拉取代码（含 LFS 大资产）。actions/checkout 是很小的官方 action，无大包下载。
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2) 定位本机 Unity 编辑器（不依赖版本匹配，直接调已安装的 Unity）
      # ⚠️ 铁律（2026-07-31 实测）：run: 脚本体必须 100% 纯 ASCII！
      #    runner 把 step 脚本写成 UTF-8 无 BOM 的临时 .ps1，Windows PowerShell 5.1
      #    按 GBK 误读 → 中文/emoji 变乱码 → 破坏引号 → ParseError → 秒退 exit 1
      #    （此前「Locate Unity Editor」1 秒红、零日志的唯一真因）。
      #    中文说明只能放 YAML 注释层（# 开头、run 块之外），绝不进 run: |。
      - name: Locate Unity Editor
        id: unity
        shell: powershell
        run: |
          $paths = @("D:\Unity\2022.3.62f3c1\Editor\Unity.exe")
          # fallback: scan D:\Unity for any Unity.exe
          $glob = Get-ChildItem "D:\Unity" -Recurse -Filter Unity.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($glob) { $paths += $glob.FullName }
          $unity = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $unity) { throw "Unity.exe not found. Install 2022.3.62f3c1 or fix path in ci.yml." }
          echo "UNITY_PATH=$unity" >> $env:GITHUB_OUTPUT
          Write-Host "Unity path: $unity"

      # 3) 存档根密钥注入（E0-S5 子任务 4 / ADR-007）
      # ------------------------------------------------------------------
      # 由仓库 Secret `SAVE_ROOT_SECRET` 生成
      #   Assets/Scripts/Services/Generated/SaveSecret.cs
      # 该文件已在 .gitignore 中，【绝不入库】；它在 RuntimeInitializeOnLoadMethod
      # 时调用 SaveKeyProvider.InjectRootSecret() 注入正式根密钥。
      # 落库的不是 Secret 原文，而是 SHA-256(Secret) 的 32 字节摘要（Base64）——
      # 即便产物泄露也拿不到 Secret 原文；对 PBKDF2 而言 32B 随机根密钥强度足够。
      # 无 Secret 时（本地 / fork / 未配置）跳过生成，运行时自动落到
      # SaveKeyProvider.DevFallbackSecret（dev 回退密钥，档案头打 dev 位，P3 警告不拒读）。
      # 红线：日志绝不回显 Secret 或 payload；生成前先断言该文件未被误提交。
      # ⚠️ 同样遵守「run 块 100% 纯 ASCII」铁律（中文只在 # 注释层）。
      - name: Inject Save Root Secret (generated, never committed)
        shell: powershell
        env:
          SAVE_ROOT_SECRET: ${{ secrets.SAVE_ROOT_SECRET }}
        run: |
          $ErrorActionPreference = "Stop"
          $root = "${{ github.workspace }}"
          $rel  = "Assets/Scripts/Services/Generated/SaveSecret.cs"
          $dir  = Join-Path $root "Assets\Scripts\Services\Generated"
          $file = Join-Path $root "Assets\Scripts\Services\Generated\SaveSecret.cs"

          # Guard: the generated key file must never be tracked by git.
          $tracked = & git -C $root ls-files -- $rel
          if ($tracked) { throw "SECURITY: $rel is tracked by git. It must stay gitignored." }

          $raw = $env:SAVE_ROOT_SECRET
          if ([string]::IsNullOrWhiteSpace($raw)) {
            Write-Host "SAVE_ROOT_SECRET not configured: skipping generation."
            Write-Host "Runtime will fall back to SaveKeyProvider.DevFallbackSecret (dev flag set on saves)."
            if (Test-Path $file) { Remove-Item $file -Force }
            exit 0
          }

          if (-not (Test-Path $dir)) { New-Item -ItemType Directory -Path $dir -Force | Out-Null }

          $sha = [System.Security.Cryptography.SHA256]::Create()
          try {
            $digest = $sha.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($raw))
          } finally {
            $sha.Dispose()
          }
          $payload = [System.Convert]::ToBase64String($digest)

          $lines = New-Object System.Collections.Generic.List[string]
          $lines.Add('// =============================================================')
          $lines.Add('// AUTO-GENERATED BY CI (.github/workflows/ci.yml). DO NOT EDIT. DO NOT COMMIT.')
          $lines.Add('// Source: repository secret SAVE_ROOT_SECRET (E0-S5 / ADR-007).')
          $lines.Add('// Payload = Base64(SHA-256(secret)) -> 32-byte root secret for PBKDF2.')
          $lines.Add('// This path is gitignored: Assets/Scripts/Services/Generated/SaveSecret.cs')
          $lines.Add('// =============================================================')
          $lines.Add('')
          $lines.Add('using System;')
          $lines.Add('using UnityEngine;')
          $lines.Add('')
          $lines.Add('namespace MJ.Services')
          $lines.Add('{')
          $lines.Add('    internal static class SaveSecret')
          $lines.Add('    {')
          $lines.Add("        private const string Payload = `"$payload`";")
          $lines.Add('')
          $lines.Add('        [RuntimeInitializeOnLoadMethod(RuntimeInitializeLoadType.BeforeSceneLoad)]')
          $lines.Add('        private static void Inject()')
          $lines.Add('        {')
          $lines.Add('            SaveKeyProvider.InjectRootSecret(Convert.FromBase64String(Payload));')
          $lines.Add('        }')
          $lines.Add('    }')
          $lines.Add('}')

          [System.IO.File]::WriteAllText($file, ($lines -join "`r`n") + "`r`n", (New-Object System.Text.UTF8Encoding($false)))

          $payload = $null
          $raw = $null
          $len = (Get-Item $file).Length
          Write-Host "Generated SaveSecret.cs ($len bytes). Key material NOT printed."
          Write-Host "Note: this file is gitignored and is regenerated on every CI run."

      # 4) 编译与导入校验（轻量，8GB 安全）
      #    无头打开工程：导入资源 + 编译 C# 脚本 + 退出。退出码 0 = 工程可正常编译。
      - name: Compile & Import Validation (lightweight, 8GB-safe)
        shell: powershell
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        # 日志写到工作区之外（D:\ci_last.log），runner 不清理，可直接读盘排障。
        # 同样遵守「run 块纯 ASCII」铁律。
        # ⚠️ 铁律二（2026-07-31 实测坐实）：必须用 Start-Process -Wait 启动 Unity，
        #    绝不能用 PowerShell 的 `& $unity ...`！
        #    实测 Unity.exe 的 PE Subsystem = 2（WINDOWS_GUI），PowerShell 的 `&`
        #    只对「控制台子系统」程序阻塞等待，对 GUI 子系统程序【立即返回】。
        #    后果：脚本秒退 → $LASTEXITCODE 取到垃圾值 → throw → step exit 1；
        #    Unity 才刚启动就被 runner 当残留子进程 kill，日志文件都来不及写。
        #    这就是 CI「8 秒报红 + D:\ci_last.log 从不生成 + 子进程被 Kill」的唯一真因。
        run: |
          $unity = "${{ steps.unity.outputs.UNITY_PATH }}"
          $project = "${{ github.workspace }}"
          $log = "D:\ci_last.log"
          if (Test-Path $log) { Remove-Item $log -Force -ErrorAction SilentlyContinue }
          $argLine = "-batchmode -quit -nographics -projectPath `"$project`" -logFile `"$log`""
          Write-Host "Headless open project: validate script compile + asset import (no exe, low memory)..."
          Write-Host "Launching (Start-Process -Wait) : $unity $argLine"
          $proc = Start-Process -FilePath $unity -ArgumentList $argLine -PassThru -Wait -NoNewWindow
          $code = $proc.ExitCode
          Write-Host "Unity exit code: $code"
          if (Test-Path $log) {
            Write-Host "==== Unity log: error/failed/exception lines ===="
            Select-String -Path $log -Pattern "error|failed|fatal|exception|could not|unable to|undefined|Received" -CaseSensitive:$false | ForEach-Object { $_.Line } | Select-Object -First 50
            Write-Host "==== Unity log tail 120 ===="
            Get-Content $log -Tail 120
          } else {
            Write-Host "WARNING: Unity wrote no log file at $log (very early crash; check Unity path / license)."
          }
          if ($code -ne 0) { throw "Unity compile/import FAILED (exit code $code). See log above." }
          Write-Host "PASS: compile/import validation OK (project opens with no compile errors)."

      # 5) EditMode 测试门控（S2-R7 自检）：-batchmode -quit -nographics -runTests
      #    跑 EditMode 程序集，产出 JUnit XML（-testResults）。退出码语义：
      #      0 = 全过 / 2 = 有失败 / 3 = 运行失败（编译/装配错误等）。
      #    非 0 即判 CI 红（S2-R7 要求门控生效）——故非 0 即 throw。
      #    ⚠️ run 块 100% 纯 ASCII 铁律（中文只在 # 注释层）。
      #    ⚠️ 铁律二：必须用 Start-Process -Wait 启动 Unity，绝不能用 `&`。
      - name: EditMode Tests (self-check gate, S2-R7)
        shell: powershell
        run: |
          $unity = "${{ steps.unity.outputs.UNITY_PATH }}"
          $project = "${{ github.workspace }}"
          $testResults = "${{ github.workspace }}\EditMode-results.xml"
          $log = "D:\ci_editmode.log"
          if (Test-Path $log) { Remove-Item $log -Force -ErrorAction SilentlyContinue }
          $argLine = "-batchmode -quit -nographics -projectPath `"$project`" -runTests -testPlatform EditMode -testResults `"$testResults`" -logFile `"$log`""
          Write-Host "Running EditMode tests (Start-Process -Wait)..."
          Write-Host "Launching: $unity $argLine"
          $proc = Start-Process -FilePath $unity -ArgumentList $argLine -PassThru -Wait -NoNewWindow
          $code = $proc.ExitCode
          Write-Host "Unity test runner exit code: $code (0=all pass, 2=failures, 3=run error)"
          if (Test-Path $log) {
            Write-Host "==== Unity test log: error/failure lines ===="
            Select-String -Path $log -Pattern "error|failed|exception|test runner|no tests|Failing" -CaseSensitive:$false | ForEach-Object { $_.Line } | Select-Object -First 50
            Write-Host "==== Unity test log tail 80 ===="
            Get-Content $log -Tail 80
          } else {
            Write-Host "WARNING: Unity wrote no log at $log (very early crash)."
          }
          if ($code -ne 0) { throw "EditMode tests FAILED (exit code $code). Gate RED. See log above." }
          Write-Host "PASS: EditMode tests green (gate self-check OK)."

      # 说明：基础阶段用「轻量编译校验」保证 CI 常绿且不爆 8GB 内存。
      # 注意：本 runner 弱网，拉 GitHub Marketplace action 易 100s 超时（upload-artifact
      # 已实测失败），故构建日志直接打印到控制台，绝不依赖 upload-artifact。
      # 后续升级到出 exe + FPS 冒烟时，将第 3 步替换为：
      #   & $unity -batchmode -quit -nographics -projectPath $project `
      #     -buildWindows64Player "$env:RUNNER_TEMP\build\MijingFanchen.exe" -logFile $log
      # 并在 Build Settings 中加入至少一个场景后启用。
